<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Game Scope</title>

  <style>
    .main-wrapper {
      display: flex;
      justify-content: center; 
      align-items: flex-start;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
    }

    .fact-box {
      width: 200px;
      flex-shrink: 0;
      background-color: #7338a0;
      color: white;
      padding: 20px;
      border-radius: 12px;
      font-family: sans-serif;
    }

    .quiz-selector-panel {
      flex-grow: 1;
      background-color: #46178f;
      border-radius: 12px;
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-header {
      background-color: #7338a0;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 12px 12px 0 0;
      font-weight: bold;
    }

    #quiz-list {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .quiz-item {
      background-color: #7338a0;
      color: white;
      border: 2px solid transparent;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-size: 18px;
    }

    .selected-quiz {
      border-color: white;
      background-color: #924dbf;
    }

    .Window-container {
      width: 95%;
      max-width: 1000px;
      height: 600px;
      background-color: #5e1a92;
      padding: 20px;
      border-radius: 12px;
      display: flex; 
      align-items: flex-start;
      justify-content: flex-start;
      padding: 40px;
      box-sizing: border-box;
    }

    .Window-container th {
      text-align: left;
      padding-bottom: 15px;
    }

    table {
      text-align: left;
      margin: 0;
      border-collapse: collapse;
    }
  </style>
</head>

<body>
  <a href=""></a>
  <h1>
    Study smarter. Practice Faster. Score better!
  </h1>

  <h3>
    <div style="text-align: left; margin-left: 40%; color: #46178f; font-size: 40px;">Game Scope</div>
  </h3>


  <div class="main-wrapper">


    <div class="fact-box">
    <h3>fun fact of the day</h3>
      <ul>
        <li>Testing yourself is better than re-reading!</li>
      </ul>
    </div>

<div class="Window-container">
    <table>
      <tr>
        <th><button class="StartButton" onclick="startSelectedQuiz()">Start Quiz</button></th>
      </tr>

      <tr>
        <th><button class="AddButton" onclick="location.href='GSAQ.html'">Add Questions</button></th>
      </tr>
      </table>


    <div class="quiz-selector-panel">

<div class="panel-header">Access your Quizzes</div>
    <div id="quiz-list">
        </div>
      </div>
    </div>
  </div>

  <p>
    Start your quiz with the "Start Quiz" button or add questions to your custom quizlet!
  </p>
  <script src="script.js"></script>

  <footer> &copy; 2026 Quiz Reviewer. All rights reserved. </footer>
</body>

</html>
