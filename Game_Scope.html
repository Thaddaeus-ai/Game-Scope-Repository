<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Game Scope</title>

  <style>
        
  .main-wrapper {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 20px; margin-top: 30px;
  width: 100%;
  flex-wrap: wrap;
  }

  .fact-box {
  width: 220px;
  flex-shrink: 0; background-color: #46178f;
  color: white;
  padding: 15px; border-radius: 12px;
   font-family: sans-serif;
  border: 2px solid #7338a0;
  box-sizing: border-box;
  }

 .fact-box h3 {
  margin: 0 0 10px 0;
   font-size: 18px;
  color: #dec9f1;
  text-align: center;
  }

  #fact-text {
  margin: 0;
  text-align: left;font-size: 15px;
  line-height: 1.4;
  color: #ffffff;
  }


  .Window-container {
    width: 95%;
    max-width: 1000px;
    min-height: 500px;
    background-color: #5e1a92; border-radius: 12px;
    display: flex; flex-wrap: wrap;
    align-items: stretch; justify-content: center;padding: 30px;
    box-sizing: border-box; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); gap: 20px;
   }

  .button-column {
  flex: 0 0 250px;
  display: flex;
  flex-direction: column;
  }

  .quiz-selector-panel {
  flex: 1 1 300px;
  background-color: #310e63;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  border: 1px solid #7338a0;min-height: 300px;
  }

  .panel-header {
  background-color: #7338a0;
  color: white;
  text-align: center; padding: 12px;
  border-radius: 11px 11px 0 0;
  font-weight: bold;
  }

   #quiz-list {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  }

  .quiz-item {
  background-color: #5e1a92; color: white;
    border: 1px solid #7338a0; padding: 15px;
      border-radius: 8px;cursor: pointer;
        text-align: left; font-size: 18px;
  }

  .selected-quiz {
  border: 2px solid #ffffff !important;background-color: #924dbf !important;
  }

  .Window-container th {
  text-align: left;
  padding-bottom: 20px;
  }

  table {
  margin: 0;
  border-collapse: collapse;
  }
  </style>
</head>

<body>
  <h1>Study smarter. Practice Faster. Score better!</h1>

  <div style="text-align: left; margin-left: 10%; color: rgb(67, 17, 143); font-size: 50px; margin-top: 20px;">
    <strong>Game Scope</strong>
  </div>

  <div class="main-wrapper">
    <div class="fact-box">
      <h3>Fun Fact of the day!</h3>
      <p id="fact-text">Testing yourself is better than re-reading!</p>
    </div>

    <div class="Window-container">
      <div class="button-column">
      <table>
      <tr>
        <th><button class="StartButton" onclick="startSelectedQuiz()">Start Quiz</button></th>
      </tr>
    
      <tr>
        <th><button class="AddButton" onclick="location.href='GSAQ.html'">Add Questions</button></th>
      </tr>
    </table>
  </div>

  <div class="quiz-selector-panel">
      <div class="panel-header">Access your Quizzes</div>
      <div id="quiz-list">

      </div>
    </div>
  </div>
</div>

  <p align="center" style="margin-top: 30px;">
    Start your quiz with the "Start Quiz" button or add questions to your custom quizlet!
  </p>

    <script src="script.js"></script>
    <footer> &copy; 2026 Quiz Reviewer. All rights reserved. </footer>
</body>
